services:
  cratelog:
    image: ghcr.io/blindpassasjer/cratelog:latest
    build: .
    restart: unless-stopped
    ports:
      - '6170:6170'
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /data   # must match the mount below
    volumes:
      - ./data:/data    # the database and covers end up in the "data" folder next to this file
